<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 56" fill="none">

  <!-- ── Icône : bouclier blanc transparent ── -->
  <g transform="translate(0,4)">
    <!-- Fond icône translucide -->
    <rect width="48" height="48" rx="10" fill="white" fill-opacity="0.15"/>

    <!-- Bouclier contour blanc -->
    <path d="M24 3 L41 10 L41 27 Q41 39 24 45 Q7 39 7 27 L7 10 Z"
          fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.6" stroke-width="1"/>

    <!-- ECG gauche -->
    <polyline points="7,27 11,27 13,21 15,33 17,24 19,27 24,27"
              fill="none" stroke="white" stroke-width="1.3" stroke-opacity="0.8"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Réseau droite -->
    <circle cx="30" cy="18" r="1.4" fill="white" opacity="0.7"/>
    <circle cx="36" cy="14" r="1.2" fill="white" opacity="0.6"/>
    <circle cx="40" cy="20" r="1.2" fill="white" opacity="0.6"/>
    <circle cx="37" cy="26" r="1.4" fill="white" opacity="0.7"/>
    <line x1="30" y1="18" x2="36" y2="14" stroke="white" stroke-width="0.9" opacity="0.45"/>
    <line x1="36" y1="14" x2="40" y2="20" stroke="white" stroke-width="0.9" opacity="0.45"/>
    <line x1="40" y1="20" x2="37" y2="26" stroke="white" stroke-width="0.9" opacity="0.45"/>
    <line x1="30" y1="18" x2="37" y2="26" stroke="white" stroke-width="0.9" opacity="0.35"/>

    <!-- Bâton caducée -->
    <line x1="24" y1="10" x2="24" y2="40"
          stroke="white" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Ailettes -->
    <path d="M24 12 Q18 9 17 13 Q18 16 24 15 Z" fill="white" opacity="0.85"/>
    <path d="M24 12 Q30 9 31 13 Q30 16 24 15 Z" fill="white" opacity="0.85"/>

    <!-- Serpents -->
    <path d="M24 18 Q20 21 24 24 Q28 27 24 30 Q20 33 24 36"
          fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M24 18 Q28 21 24 24 Q20 27 24 30 Q28 33 24 36"
          fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ── Texte blanc ── -->
  <text x="62" y="36" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="26" fill="white">MediLink</text>
  <text x="63" y="51" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="rgba(255,255,255,0.6)" letter-spacing="0.6">DME Unifié · Bénin</text>
</svg>
